<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0369a1" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Soft Blue Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="16" />

  <!-- Floating Dashboard Card -->
  <rect x="60" y="50" width="680" height="350" rx="16" fill="url(#cardGrad)" filter="url(#shadow)" />

  <!-- Dashboard Header Bar -->
  <rect x="90" y="80" width="200" height="14" rx="7" fill="#0284c7" opacity="0.8" />
  <rect x="90" y="104" width="120" height="10" rx="5" fill="#64748b" opacity="0.5" />

  <!-- KPI Cards -->
  <g transform="translate(90, 135)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="180" height="80" rx="10" fill="#ffffff" opacity="0.9" />
    <rect x="15" y="15" width="60" height="8" rx="4" fill="#94a3b8" />
    <text x="15" y="48" font-family="sans-serif" font-weight="bold" font-size="20" fill="#0f172a">$248.5K</text>
    <text x="115" y="48" font-family="sans-serif" font-size="12" font-weight="600" fill="#10b981">+18.4%</text>

    <!-- KPI 2 -->
    <rect x="200" y="0" width="180" height="80" rx="10" fill="#ffffff" opacity="0.9" />
    <rect x="215" y="15" width="60" height="8" rx="4" fill="#94a3b8" />
    <text x="215" y="48" font-family="sans-serif" font-weight="bold" font-size="20" fill="#0f172a">1,420</text>
    <text x="315" y="48" font-family="sans-serif" font-size="12" font-weight="600" fill="#0284c7">Active</text>

    <!-- KPI 3 -->
    <rect x="400" y="0" width="100" height="80" rx="10" fill="#ffffff" opacity="0.9" />
    <circle cx="450" cy="40" r="22" stroke="#0284c7" stroke-width="6" fill="none" stroke-dasharray="100 38" />
  </g>

  <!-- Sales Chart Graphic -->
  <g transform="translate(90, 240)">
    <rect x="0" y="0" width="500" height="130" rx="10" fill="#ffffff" opacity="0.95" />
    <!-- Gridlines -->
    <line x1="20" y1="30" x2="480" y2="30" stroke="#f1f5f9" stroke-width="1" />
    <line x1="20" y1="65" x2="480" y2="65" stroke="#f1f5f9" stroke-width="1" />
    <line x1="20" y1="100" x2="480" y2="100" stroke="#f1f5f9" stroke-width="1" />

    <!-- Bar graphs -->
    <rect x="40" y="60" width="20" height="40" rx="4" fill="#cbd5e1" />
    <rect x="80" y="45" width="20" height="55" rx="4" fill="#bae6fd" />
    <rect x="120" y="30" width="20" height="70" rx="4" fill="#38bdf8" />
    <rect x="160" y="50" width="20" height="50" rx="4" fill="#cbd5e1" />
    <rect x="200" y="25" width="20" height="75" rx="4" fill="#0284c7" />
    <rect x="240" y="40" width="20" height="60" rx="4" fill="#38bdf8" />
    <rect x="280" y="20" width="20" height="80" rx="4" fill="#0284c7" />
    <rect x="320" y="35" width="20" height="65" rx="4" fill="#bae6fd" />

    <!-- Trend line -->
    <path d="M 50 65 Q 110 20 170 45 T 290 20 T 450 15" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" />
    <circle cx="450" cy="15" r="5" fill="#0284c7" />
  </g>
</svg>